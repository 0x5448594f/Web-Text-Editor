<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web Text Editor</title>
  </head>
  <body>
      <main>
          <section class="buttons">
              <button class="bold_button">B</button>
              <button class="italic_button">I</button>
              <button class="title_button">tT</button>
              <button class="code_button"><></button>
              <div class="file_button_container">
                  <p>Add Image</p>
                  <input type="file" class="file_button"/>
              </div>
          </section>

          <section class="render">
          </section>

          <textarea id="input" placeholder="Enter your paragraph here...."></textarea>

          <div class="valid_container">
            <span class="valid_info"></span>
            <button class="valid"></button>
          </div>
      </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
